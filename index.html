    <!-- 3-Photo Smooth Cross-Fade Slider Script -->
    <script>
      (function() {
        var slides = document.querySelectorAll('.home-banner-slide');
        if (slides.length > 1) {
          var current = 0;
          setInterval(function() {
            slides[current].style.opacity = '0';
            current = (current + 1) % slides.length;
            slides[current].style.opacity = '1';
          }, 4500);
        }
      })();
    </script>
